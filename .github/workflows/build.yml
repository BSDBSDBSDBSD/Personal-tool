name: Build Assistant APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Ozer-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as GitHub release "latest"
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ozer.apk
          # Offline speech models (whisper.cpp), attached so everything downloads from one page.
          HF=https://huggingface.co/ggerganov/whisper.cpp/resolve/main
          MODELS=""
          for m in ggml-small-q5_1.bin ggml-base-q5_1.bin ggml-small.bin; do
            if curl -fsSL --retry 3 -o "$m" "$HF/$m"; then MODELS="$MODELS $m"; ls -l "$m"; else echo "::warning::could not download $m"; fi
          done
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Ozer.apk $MODELS --title "עוזר – build ${{ github.run_number }}" \
            --notes-file .github/release-notes.md --target ${{ github.sha }}

      - name: Save build log and APK to branch build-output
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          echo "${{ steps.build.outcome }} ${{ github.sha }}" > /tmp/out/result.txt
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > /tmp/out/errors.txt 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk /tmp/out/Ozer.apk 2>/dev/null || true
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
